<h1>Mes reservations</h1>
<div class="parking-list">
  <div *ngFor="let parking of parkings" class="parking-card">
    <img [src]="parking.imageUrl" alt="Parking image" class="parking-image">

    <div class="parking-info">
      <h2>{{ parking.nom }} <span class="parking-type">({{ parking.type }})</span></h2>
      <p class="address">{{ parking.adresse }}</p>
      <div class="distance">
        Distance {{ parking.distance }}
        <p class="reservation-time">
            Date et heure de debut de reservation : {{ parking.reservationDate}} 
          </p>
      </div>
    </div>

    <div class="parking-actions">
      <button 
        class="btn btn-primary"
        [ngClass]="{'btn-disabled': isCancellationDisabled(parking.reservationDate)}"
        [disabled]="isCancellationDisabled(parking.reservationDate)">
        Annuler
      </button>
      <p *ngIf="isCancellationDisabled(parking.reservationDate)" class="error-text">
        La réservation ne peut pas être annulée si elle est inferieur a 48h.
      </p>    
    </div>
  </div>
</div>
