<div class="search-container">
  <form>
    <mat-form-field appearance="outline">
      <mat-label>Lieu de stationnement</mat-label>
      <input matInput placeholder="Saisissez un lieu" [(ngModel)]="location" name="location">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Date début</mat-label>
      <input matInput [matDatepicker]="datepickerDebut" [(ngModel)]="Debut" name="DebutDate">
      <mat-datepicker #datepickerDebut></mat-datepicker>
      <mat-datepicker-toggle [for]="datepickerDebut" matSuffix></mat-datepicker-toggle>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Heure début</mat-label>
      <input matInput
        [matTimepicker]="timepickerDebut"
        [(ngModel)]="Debut"
        name="DebutTime"
        [ngModelOptions]="{updateOn: 'blur'}">
      <mat-timepicker #timepickerDebut></mat-timepicker>
      <mat-timepicker-toggle [for]="timepickerDebut" matSuffix></mat-timepicker-toggle>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Date fin</mat-label>
      <input matInput [matDatepicker]="datepickerfin" [(ngModel)]="Fin" name="FinDate">
      <mat-datepicker #datepickerfin></mat-datepicker>
      <mat-datepicker-toggle [for]="datepickerfin" matSuffix></mat-datepicker-toggle>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Heure fin</mat-label>
      <input matInput
        [matTimepicker]="timepickerFin"
        [(ngModel)]="Fin"
        name="FinTime"
        [ngModelOptions]="{updateOn: 'blur'}">
      <mat-timepicker #timepickerFin></mat-timepicker>
      <mat-timepicker-toggle [for]="timepickerFin" matSuffix></mat-timepicker-toggle>
    </mat-form-field>

    <p>{{Debut}} {{Fin}}</p>

    <button mat-raised-button color="primary" type="submit" (click)="onSearch()">Rechercher</button>
  </form>
</div>
