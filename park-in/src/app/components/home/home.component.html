<form [formGroup]="searchForm" class="search-form">
  <p-floatLabel class="input-large">
    <input pInputText id="lieu" formControlName="location" class="p-inputtext" />
    <label for="lieu">Lieu de stationnement</label>
  </p-floatLabel>

  <p-calendar formControlName="dateDebut" [showIcon]="true" [iconDisplay]="'input'" class="input-medium" placeholder="Date début"></p-calendar>

  <p-calendar formControlName="dateDebut" [showIcon]="true" [iconDisplay]="'input'" [timeOnly]="true" class="input-small" placeholder="Heure début"></p-calendar>

  <p-calendar formControlName="dateFin" [showIcon]="true" [iconDisplay]="'input'" class="input-medium" placeholder="Date fin"></p-calendar>

  <p-calendar formControlName="dateFin" [showIcon]="true" [iconDisplay]="'input'" [timeOnly]="true" class="input-small" placeholder="Heure Fin"></p-calendar>

  <p-button label="Rechercher" type="submit" (onClick)="onSearch()" class="input-button"></p-button>
  <p-checkbox label="Places PMR"  [binary]="true" name="pmr"></p-checkbox>
  <p-dropdown formControlName=""></p-dropdown>

</form>
