<div class="search-container">
  <h2>Trouver votre Parking !</h2>
  <form [formGroup]="searchForm" class="search-form">
    
    <div class="form-row">
      <mat-form-field class="input-medium" appearance="outline">
        <mat-label>Lieu de stationnement</mat-label>
        <input #autoCompleteInput matInput id="lieu" formControlName="location">
      </mat-form-field>
    </div>

    <!-- ✅ Date et heure de début (Séparés) -->
    <div class="form-row">
      <mat-form-field class="input-small" appearance="outline">
        <mat-label>Date début</mat-label>
        <input matInput [matDatepicker]="startDate" formControlName="dateDebut" [min]="minDate">
        <mat-datepicker-toggle matIconSuffix [for]="startDate"></mat-datepicker-toggle>
        <mat-datepicker #startDate></mat-datepicker>
      </mat-form-field>

      <mat-form-field class="input-small" appearance="outline">
        <mat-label>Heure début</mat-label>
        <input matInput [matTimepicker]="startTime" formControlName="timeDebut">
        <mat-timepicker-toggle matIconSuffix [for]="startTime"></mat-timepicker-toggle>
        <mat-timepicker #startTime interval="10m"></mat-timepicker>
      </mat-form-field>
    </div>

    <!-- ✅ Date et heure de fin (Séparés) -->
    <div class="form-row">
      <mat-form-field class="input-small" appearance="outline">
        <mat-label>Date fin</mat-label>
        <input matInput [matDatepicker]="endDate" formControlName="dateFin" [min]="searchForm.get('dateDebut')?.value">
        <mat-datepicker-toggle matIconSuffix [for]="endDate"></mat-datepicker-toggle>
        <mat-datepicker #endDate></mat-datepicker>
      </mat-form-field>

      <mat-form-field class="input-small" appearance="outline">
        <mat-label>Heure fin</mat-label>
        <input matInput [matTimepicker]="endTime" formControlName="timeFin">
        <mat-timepicker-toggle matIconSuffix [for]="endTime"></mat-timepicker-toggle>
        <mat-timepicker #endTime interval="10m"></mat-timepicker>
      </mat-form-field>
    </div>

    <!-- ✅ Autres options -->
    <div class="form-row">
      <mat-form-field style="width: 150px;" appearance="outline">
        <mat-label>Hauteur(m)</mat-label>
        <input matInput formControlName="hauteur">
      </mat-form-field>

      <mat-form-field style="width: 250px;" appearance="outline">
        <mat-label>Type de place</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let place of typePlaces" [value]="place.value">
            {{ place.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field style="width: 250px;" appearance="outline">
        <mat-label>Type de parking</mat-label>
        <mat-select formControlName="typeOuvrage">
          <mat-option *ngFor="let parking of typeParkings" [value]="parking.value">
            {{ parking.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-checkbox class="custom-checkbox" formControlName="pmr">Places PMR</mat-checkbox>
    </div>

    <button mat-raised-button class="custom-button" type="submit" (click)="onSearch()">Rechercher</button>
  </form>
</div>

<div *ngIf="isLoading" class="spinner-overlay">
  <mat-spinner></mat-spinner>
</div>
